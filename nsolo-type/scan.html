<!doctype html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>scan</title><script type='module' src='/src/scan.ts'></script></head><body>
<div class='container'>
  <section class='hero'>
    <span class='badge'>Step 1</span>
    <h1>전면 카메라 또는 사진 업로드</h1>
    <p>재미용 분류입니다. 이미지는 서버로 전송되지 않습니다.</p>
  </section>

  <section class='card stack'>
    <label>성별 선택(추천 타입 필터)</label>
    <select id='gender'>
      <option value='male'>남성</option>
      <option value='female'>여성</option>
    </select>
  </section>

  <section class='card stack'>
    <video id='video' autoplay playsinline muted></video>
    <div class='row'>
      <button id='capture' class='btn secondary'>카메라 캡처</button>
    </div>
    <input id='upload' type='file' accept='image/*' />
    <canvas id='preview' width='320' height='320'></canvas>
    <p id='status' class='muted'>카메라 준비중...</p>
    <button id='analyze'>분석하기</button>
    <small class='muted'>TIP: 얼굴이 정면에 크게 보일수록 결과가 안정적입니다.</small>
  </section>

  <a class='btn ghost' href='/'>돌아가기</a>
</div>
</body></html>
